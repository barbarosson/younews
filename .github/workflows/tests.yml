name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: License unit tests
        env:
          YOU_NEWS_LICENSE_HMAC: "ababababababababababababababababababababababababababababababababab"
          YOU_NEWS_HOME: ${{ runner.temp }}/younews-ci
          GNT_SKIP_NETWORK: "1"
        run: python -m unittest tests.test_license -v
